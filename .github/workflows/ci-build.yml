name: "CI Build"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Set up JDK 11 for cross-version tests
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 11
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: "./gradlew check"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          JDK11: ${{ env.JAVA_HOME_11_X64 }}
